<!doctype html><html lang="fr"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commandes King Food</title><style>body{font-family:system-ui;background:#171313;color:#fff;margin:0}header{background:#9f2432;padding:18px;position:sticky;top:0}main{padding:16px;max-width:760px;margin:auto}.order{background:#fff;color:#222;border-radius:16px;padding:16px;margin:14px 0;border-left:9px solid #c52e40}.id{font-size:22px;font-weight:800}button,input{font-size:17px;padding:13px;border-radius:10px;border:0;margin:5px}button{background:#18864b;color:#fff}.reject{background:#9f2432}.empty{text-align:center;margin-top:80px;color:#aaa}</style><header><b>👑 KING FOOD AIGLE</b><br>Nouvelles commandes WhatsApp</header><main id="orders"></main><script>let known='',pin=sessionStorage.getItem('adminPin')||prompt('Code administrateur :')||'';sessionStorage.setItem('adminPin',pin);const headers=()=>({'Content-Type':'application/json','x-admin-pin':pin});const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/orders',{headers:headers()});if(r.status===401){sessionStorage.removeItem('adminPin');orders.textContent='Code incorrect. Recharge la page.';return}const os=await r.json(),fresh=os.filter(o=>o.status==='NOUVELLE');if(fresh[0]?.orderId!==known&&fresh.length){known=fresh[0].orderId;beep()}orders.innerHTML=fresh.length?fresh.map(render).join(''):'<div class="empty">Aucune nouvelle commande</div>'}function render(o){const id=h(o.orderId);return `<div class=order><div class=id>${id} · ${h(o.name)}</div><div>${h(o.channel)}${o.city?' · '+h(o.city)+' · '+h(o.address):''}</div><div>Heure souhaitée : <b>${h(o.time)}</b></div><hr>${o.cart.map(x=>`<p><b>${h(x.quantity)}× ${h(x.product.name)}</b><br>${x.selections.map(s=>h(s.group)+': '+s.chosen.map(c=>h(c.name)).join(', ')).join('<br>')}</p>`).join('')}<input id="e${id}" type=number value=25 min=5> min <button data-id="${id}" data-status="ACCEPTEE">Accepter</button><button class=reject data-id="${id}" data-status="REFUSEE">Refuser</button></div>`}orders.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)act(b.dataset.id,b.dataset.status)});async function act(id,status){await fetch('/api/orders/'+encodeURIComponent(id),{method:'PATCH',headers:headers(),body:JSON.stringify({status,eta:document.querySelector('#e'+CSS.escape(id)).value})});load()}function beep(){const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),700);navigator.vibrate?.([500,200,500])}setInterval(load,3000);load()</script></html>
