<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>King Food — Fidélité Employé</title><style>
:root{--b:#6d0f1b;--g:#deb653;--bg:#0d0d0f;--card:#171719}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0d0d0f,#27070c);color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:18px}.wrap{max-width:520px;margin:auto}.head{text-align:center}.logo{width:72px;height:72px;border-radius:50%;object-fit:cover}.head h1{color:var(--g);margin:8px 0 2px;font-size:25px}.head p{margin:0 0 18px;color:#aaa}.card{background:var(--card);border:1px solid #4a3820;border-radius:20px;padding:18px;margin:12px 0}label{display:block;font-weight:700;margin:10px 0 6px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #555;background:#0c0c0e;color:#fff;font-size:17px}button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:12px;font-size:17px;font-weight:800;background:var(--g);color:#201507}button.secondary{background:#343438;color:#fff}button.danger{background:#7d1722;color:#fff}button:disabled{opacity:.45}.hidden{display:none}.err{color:#ff9c9c;text-align:center;min-height:22px;margin-top:10px}.ok{color:#8fe3a7;text-align:center;min-height:22px;margin-top:10px}.person{text-align:center}.person h2{font-size:28px;margin:5px}.member{color:#aaa}.count{font-size:52px;font-weight:900;color:var(--g);margin:12px 0 0}.progress{height:12px;background:#333;border-radius:99px;overflow:hidden;margin:8px 0 18px}.bar{height:100%;background:var(--g)}.reward{padding:12px;border-radius:12px;background:#251b0d;color:#f5d991;margin:10px 0}.birthday{padding:12px;border-radius:12px;background:#251015;margin:10px 0}.scan{font-size:15px;color:#bbb;text-align:center}.small{font-size:12px;color:#999;text-align:center}</style></head><body><main class="wrap"><div class="head"><img class="logo" src="/kingfood-wallet-logo.png"><h1>Espace fidélité employé</h1><p>King Food</p></div>
<section class="card" id="login"><label>Code employé</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••"><button id="loginBtn">Ouvrir</button><div class="err" id="loginErr"></div></section>
<section class="card hidden" id="search"><label>Scanner ou saisir le N° membre</label><input id="member" autocomplete="off" autocapitalize="characters" placeholder="KF-XXXXXXXXXX"><button id="cameraBtn">📷 Scanner le QR</button><button class="secondary" id="findBtn">Rechercher le client</button><p class="scan">Le scanner caméra utilise le lecteur QR du navigateur quand il est disponible.</p><div class="err" id="searchErr"></div></section>
<section class="card hidden person" id="customer"><div class="member" id="memberOut"></div><h2 id="name"></h2><div class="count"><span id="points">0</span><small style="font-size:20px"> / 9</small></div><div class="progress"><div class="bar" id="bar"></div></div><div class="reward" id="reward"></div><div class="birthday" id="birthday"></div><button id="plus">+1 achat</button><button class="secondary" id="undo">↩️ Annuler le dernier +1</button><button class="secondary" id="redeem">🎁 Utiliser une récompense</button><button class="secondary" id="birthdayBtn">🎂 Utiliser le menu anniversaire</button><button class="danger" id="other">Scanner un autre client</button><div class="ok" id="ok"></div><div class="err" id="actionErr"></div></section>
<p class="small">Accès réservé au personnel King Food.</p></main><script>
let PIN='',current='';const $=x=>document.querySelector(x);function auth(){return {'x-admin-pin':PIN}};async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...(opt.headers||{}),...auth()}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||(r.status===401?'Code employé incorrect':'Erreur '+r.status));return j}
$('#loginBtn').onclick=async()=>{PIN=$('#pin').value.trim();try{await api('/api/loyalty/KF-LOGIN-CHECK');$('#login').classList.add('hidden');$('#search').classList.remove('hidden')}catch(e){if(e.message==='Erreur 404'){$('#login').classList.add('hidden');$('#search').classList.remove('hidden')}else $('#loginErr').textContent=e.message}};
async function load(id){id=String(id||'').trim().toUpperCase();if(!id)return;$('#searchErr').textContent='';try{const c=await api('/api/loyalty/'+encodeURIComponent(id));current=c.member_id;render(c);$('#search').classList.add('hidden');$('#customer').classList.remove('hidden')}catch(e){$('#searchErr').textContent=e.message==='Erreur 404'?'Client introuvable':e.message}}
function render(c){$('#memberOut').textContent=c.member_id;$('#name').textContent=c.first_name+' '+c.last_name;$('#points').textContent=c.purchases;$('#bar').style.width=(c.purchases/9*100)+'%';$('#reward').textContent=c.rewards_available>0?'🎁 10e MENU OFFERT DISPONIBLE — Tacos M + boisson OU Tasty Crousty M + boisson':'🎁 10e menu offert après 9 achats payés';const d=new Date(c.birth_date);$('#birthday').textContent='🎂 Anniversaire : '+String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+(c.birthday_redeemed_year?' — utilisé en '+c.birthday_redeemed_year:'');$('#redeem').disabled=!c.rewards_available}
$('#findBtn').onclick=()=>load($('#member').value);
$('#other').onclick=()=>{current='';$('#member').value='';$('#customer').classList.add('hidden');$('#search').classList.remove('hidden');$('#ok').textContent='';$('#actionErr').textContent=''};
async function act(s){$('#ok').textContent='';$('#actionErr').textContent='';try{const c=await api('/api/loyalty/'+encodeURIComponent(current)+'/'+s,{method:'POST'});render(c);$('#ok').textContent=s==='purchase'?'✅ Achat ajouté et Wallet mis à jour':s==='undo-purchase'?'↩️ Dernier achat annulé et Wallet corrigé':'✅ Opération enregistrée'}catch(e){$('#actionErr').textContent=e.message}}
$('#plus').onclick=()=>act('purchase');$('#undo').onclick=()=>act('undo-purchase');$('#redeem').onclick=()=>act('redeem');$('#birthdayBtn').onclick=()=>act('birthday');
$('#cameraBtn').onclick=async()=>{if(!('BarcodeDetector'in window)){alert("Le scanner QR intégré n'est pas disponible dans ce navigateur. Utilisez l'appareil photo du téléphone puis saisissez le code KF affiché sous le QR.");return}try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=document.createElement('video');v.srcObject=stream;v.setAttribute('playsinline','');v.style='position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:99;background:#000';document.body.appendChild(v);await v.play();const det=new BarcodeDetector({formats:['qr_code']});const loop=async()=>{if(!v.isConnected)return;const a=await det.detect(v);if(a[0]){stream.getTracks().forEach(t=>t.stop());v.remove();$('#member').value=a[0].rawValue;load(a[0].rawValue)}else requestAnimationFrame(loop)};loop()}catch(e){alert("Caméra indisponible. Autorisez la caméra ou saisissez le numéro KF.")}};
</script></body></html>
