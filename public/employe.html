<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d0f1b"><link rel="manifest" href="/employe.webmanifest"><link rel="icon" href="/kingfood-wallet-logo.png"><title>King Food — Employé</title><style>
:root{--b:#6d0f1b;--g:#deb653;--bg:#0d0d0f;--card:#171719}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0d0d0f,#27070c);color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:16px}.wrap{max-width:520px;margin:auto}.head{text-align:center;margin:4px 0 12px}.logo{width:70px;height:70px;border-radius:50%;object-fit:cover}.card{background:var(--card);border:1px solid #4a3820;border-radius:22px;padding:18px;margin:12px 0}.hidden{display:none}input{width:100%;padding:16px;border-radius:14px;border:1px solid #555;background:#0c0c0e;color:#fff;font-size:19px;margin:8px 0}button{width:100%;border:0;border-radius:16px;padding:18px;margin-top:12px;font-size:22px;font-weight:900;background:var(--g);color:#201507;min-height:62px}button.secondary{background:#343438;color:#fff}button.danger{background:#67121d;color:#fff}button:disabled{opacity:.3}.loginTitle{text-align:center;font-size:28px;color:var(--g);margin:6px}.scanBtn{font-size:34px;min-height:105px}.person{text-align:center}.person h2{font-size:28px;margin:4px}.member{color:#999;font-size:13px}.count{font-size:64px;font-weight:950;color:var(--g);margin:8px 0}.count small{font-size:24px}.progress{height:15px;background:#333;border-radius:99px;overflow:hidden;margin:4px 0 18px}.bar{height:100%;background:var(--g)}.status{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.tile{padding:15px 8px;border-radius:16px;background:#251b0d;font-size:30px;font-weight:900}.tile small{display:block;font-size:13px;color:#ddd;margin-top:4px}.actions{display:grid;grid-template-columns:1.35fr .65fr;gap:10px}.actions button{margin:0}.gift{font-size:28px}.ok,.err{text-align:center;min-height:24px;margin-top:10px;font-weight:800}.ok{color:#8fe3a7}.err{color:#ff9c9c}.mini{font-size:14px;min-height:46px;padding:10px}.toprow{display:flex;gap:8px}.toprow button{width:auto;flex:1}.camera{position:fixed;inset:0;z-index:99;background:#000}.camera video{width:100%;height:100%;object-fit:cover}.camera button{position:absolute;bottom:28px;left:10%;width:80%;background:#fff;color:#111}</style></head><body><main class="wrap"><div class="head"><img class="logo" src="/kingfood-wallet-logo.png" alt="King Food"></div>
<section class="card" id="login"><div class="loginTitle">🔐</div><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe"><button id="loginBtn">✓</button><div class="err" id="loginErr"></div></section>
<section class="card hidden" id="search"><button class="scanBtn" id="cameraBtn">📷<br>SCAN</button><div class="toprow"><input id="member" autocomplete="off" autocapitalize="characters" placeholder="KF-…"><button class="mini secondary" id="findBtn">🔎</button></div><div class="err" id="searchErr"></div></section>
<section class="card hidden person" id="customer"><div class="member" id="memberOut"></div><h2 id="name"></h2><div class="count"><span id="points">0</span><small>/9</small></div><div class="progress"><div class="bar" id="bar"></div></div><div class="status"><div class="tile" id="reward">🔒<small>🎁</small></div><div class="tile" id="birthday">🔒<small>🎂</small></div></div><div class="actions"><button id="plus">➕ 1</button><button class="secondary" id="undo">➖ 1</button></div><button class="secondary gift" id="redeem">🎁</button><button class="secondary gift" id="birthdayBtn">🎂</button><button class="danger" id="other">📷</button><div class="ok" id="ok"></div><div class="err" id="actionErr"></div></section>
<div id="camera" class="camera hidden"><video id="video" playsinline></video><button id="cancelCam">✕</button></div></main><script>
let current='',busy=false,stream=null;const $=x=>document.querySelector(x);
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},credentials:'same-origin'});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||(r.status===401?'🔐':'⚠️'));return j}
function show(id){['login','search','customer'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
async function check(){try{const x=await api('/api/staff/session');show(x.authenticated?'search':'login')}catch{show('login')}}
$('#loginBtn').onclick=async()=>{const p=$('#password').value;$('#loginErr').textContent='';try{await api('/api/staff/login',{method:'POST',body:JSON.stringify({password:p})});$('#password').value='';show('search')}catch(e){$('#loginErr').textContent=e.message}};
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});
async function load(id){id=String(id||'').trim().toUpperCase();if(!id)return;$('#searchErr').textContent='';try{const c=await api('/api/loyalty/'+encodeURIComponent(id));current=c.member_id;render(c);show('customer')}catch(e){if(e.message==='🔐'){show('login');return}$('#searchErr').textContent='❌'}}
function render(c){$('#memberOut').textContent=c.member_id;$('#name').textContent=c.first_name+' '+c.last_name;$('#points').textContent=c.purchases;$('#bar').style.width=(c.purchases/9*100)+'%';$('#reward').innerHTML=(c.rewards_available>0?'🎁 ✓':'🔒')+'<small>🎁 '+c.rewards_available+'</small>';const d=new Date(c.birth_date),now=new Date(),today=d.getUTCDate()===now.getDate()&&d.getUTCMonth()===now.getMonth(),used=c.birthday_redeemed_year===now.getFullYear();$('#birthday').innerHTML=((today&&!used)?'🎂 ✓':used?'✓':'🔒')+'<small>🎂</small>';$('#redeem').disabled=!c.rewards_available;$('#birthdayBtn').disabled=!today||used;$('#undo').disabled=Number(c.purchases)<=0}
$('#findBtn').onclick=()=>load($('#member').value);$('#member').addEventListener('keydown',e=>{if(e.key==='Enter')load($('#member').value)});
$('#other').onclick=()=>{current='';$('#member').value='';$('#ok').textContent='';$('#actionErr').textContent='';show('search')};
async function act(s){if(busy)return;busy=true;const bs=[...document.querySelectorAll('#customer button')];bs.forEach(b=>b.disabled=true);$('#ok').textContent='';$('#actionErr').textContent='';try{const c=await api('/api/loyalty/'+encodeURIComponent(current)+'/'+s,{method:'POST'});render(c);$('#ok').textContent='✓'}catch(e){if(e.message==='🔐'){show('login');return}$('#actionErr').textContent='❌'}finally{busy=false;try{const c=await api('/api/loyalty/'+encodeURIComponent(current));render(c)}catch{} }}
$('#plus').onclick=()=>act('purchase');$('#undo').onclick=()=>act('undo-purchase');$('#redeem').onclick=()=>act('redeem');$('#birthdayBtn').onclick=()=>act('birthday');
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#camera').classList.add('hidden')}
$('#cancelCam').onclick=stopCam;
$('#cameraBtn').onclick=async()=>{if(!('BarcodeDetector'in window)){alert('📷 ❌');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#video');v.srcObject=stream;$('#camera').classList.remove('hidden');await v.play();const det=new BarcodeDetector({formats:['qr_code']});const loop=async()=>{if(!stream)return;const a=await det.detect(v);if(a[0]){const raw=a[0].rawValue;stopCam();$('#member').value=raw;load(raw)}else requestAnimationFrame(loop)};loop()}catch{stopCam();alert('📷 ❌')}};
check();
</script></body></html>
