<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d0f1b"><title>King Food — Patron</title><style>
:root{--b:#6d0f1b;--g:#deb653;--bg:#0d0d0f;--card:#171719}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0d0d0f,#27070c);color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:16px}.wrap{max-width:620px;margin:auto}.head{text-align:center}.logo{width:72px;height:72px;border-radius:50%;object-fit:cover}.card{background:var(--card);border:1px solid #4a3820;border-radius:20px;padding:16px;margin:12px 0}.hidden{display:none}input{width:100%;padding:14px;border-radius:12px;border:1px solid #555;background:#0c0c0e;color:#fff;font-size:18px;margin:6px 0}button,.nav{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:10px;font-size:18px;font-weight:850;background:var(--g);color:#201507;text-align:center;text-decoration:none}.nav{background:#343438;color:#fff}.danger{background:#8b1e2d;color:#fff}.green{background:#16853b;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.client{cursor:pointer}.client b{font-size:18px}.muted{color:#aaa;font-size:13px}.title{text-align:center;color:var(--g)}.err{color:#ff9c9c;text-align:center}.ok{color:#8fe3a7;text-align:center}.field{margin-top:10px}.field label{font-size:13px;color:#bbb}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.info div,.event{background:#101012;border-radius:12px;padding:10px}.info b{display:block;color:var(--g);font-size:13px}.history{margin-top:18px}.event{margin:7px 0}.event strong{display:block}.event small{color:#999}</style></head><body><main class="wrap"><div class="head"><img class="logo" src="/kingfood-wallet-logo.png"><h2>👑 Espace patron</h2></div>
<section class="card" id="login"><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe patron"><button id="loginBtn">Connexion</button><a class="nav" href="/employe.html">← Espace employé</a><div class="err" id="loginErr"></div></section>
<section id="main" class="hidden"><a class="nav" href="/employe.html">← Espace employé</a><section class="card"><input id="q" placeholder="Nom, prénom, téléphone ou KF-…"><button id="search">🔎 Rechercher</button></section><div id="results"></div><button class="nav" id="logout">Déconnexion patron</button></section>
<section class="card hidden" id="edit"><button class="nav" id="back">← Clients</button><h2 class="title" id="who"></h2><div class="muted" id="mid"></div><div class="info"><div><b>Téléphone</b><span id="phone">—</span></div><div><b>Inscrit le</b><span id="created">—</span></div><div><b>Date de naissance</b><span id="dob">—</span></div><div><b>Dernière activité</b><span id="updated">—</span></div></div><div class="field"><label>Solde de points</label><input id="points" type="number" min="0" max="1000000"></div><div class="field"><label>Anniversaire utilisé en année (vide = non utilisé)</label><input id="birthdayYear" type="number" min="2020" max="2100"></div><button class="green" id="save">✓ Enregistrer et synchroniser Wallet</button><div class="history"><h3>Historique</h3><div id="history"></div></div><button class="danger" id="delete">Supprimer ce client</button><div class="ok" id="ok"></div><div class="err" id="err"></div></section>
</main><script>
const $=s=>document.querySelector(s);let current=null;async function api(path,opt={}){const r=await fetch(path,{...opt,credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'Erreur');return j}
function showMain(){ $('#login').classList.add('hidden');$('#edit').classList.add('hidden');$('#main').classList.remove('hidden') }
async function check(){try{const x=await api('/api/owner/session');if(x.authenticated){showMain();search()}}catch{}}
$('#loginBtn').onclick=async()=>{try{await api('/api/owner/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#password').value='';showMain();search()}catch(e){$('#loginErr').textContent=e.message}};
$('#password').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};
async function search(){try{const a=await api('/api/owner/customers?q='+encodeURIComponent($('#q').value));$('#results').innerHTML=a.map((c,i)=>'<section class="card client" data-i="'+i+'"><b>'+esc(c.first_name)+' '+esc(c.last_name)+'</b><div class="muted">'+esc(c.member_id)+' · ⭐ '+Number(c.points||0).toLocaleString('fr-CH')+' pts'+'</div></section>').join('')||'<section class="card muted">Aucun client</section>';[...document.querySelectorAll('.client')].forEach(x=>x.onclick=()=>open(a[+x.dataset.i]))}catch(e){if(e.message==='Erreur')location.reload()}}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function open(c){current=c;$('#main').classList.add('hidden');$('#edit').classList.remove('hidden');$('#who').textContent=c.first_name+' '+c.last_name;$('#mid').textContent=c.member_id;$('#phone').textContent=c.phone||'—';$('#dob').textContent=new Date(c.birth_date).toLocaleDateString('fr-CH');$('#created').textContent=new Date(c.created_at).toLocaleDateString('fr-CH');$('#updated').textContent=new Date(c.updated_at).toLocaleString('fr-CH');$('#points').value=c.points||0;$('#birthdayYear').value=c.birthday_redeemed_year||'';$('#ok').textContent='';$('#err').textContent='';$('#history').innerHTML='Chargement…';try{const h=await api('/api/owner/customers/'+encodeURIComponent(c.member_id)+'/history');const names={POINTS_EARNED:'⭐ Points ajoutés',POINTS_REDEEMED:'🎁 Récompense utilisée',POINTS_ADJUSTED:'⚙️ Correction patron',BIRTHDAY_REDEEMED:'🎂 Anniversaire utilisé',PURCHASE:'Ancien achat V1',MANUAL_MINUS:'Ancien retrait V1',REWARD_REDEEMED:'Ancienne récompense V1'};$('#history').innerHTML=h.map(x=>'<div class="event"><strong>'+(names[x.event_type]||esc(x.event_type))+'</strong><small>'+new Date(x.created_at).toLocaleString('fr-CH')+(x.note?' · '+esc(x.note):'')+'</small></div>').join('')||'<div class="muted">Aucun événement</div>'}catch{$('#history').innerHTML='<div class="muted">Historique indisponible</div>'}}
$('#search').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search()};$('#back').onclick=()=>{showMain();search()};
$('#save').onclick=async()=>{try{const c=await api('/api/owner/customers/'+encodeURIComponent(current.member_id),{method:'PATCH',body:JSON.stringify({points:$('#points').value,birthday_redeemed_year:$('#birthdayYear').value})});current=c;$('#ok').textContent='✓ Enregistré';$('#err').textContent=''}catch(e){$('#err').textContent=e.message}};
$('#delete').onclick=async()=>{if(!confirm('Supprimer définitivement ce client et son historique ?'))return;try{await api('/api/owner/customers/'+encodeURIComponent(current.member_id),{method:'DELETE'});showMain();search()}catch(e){$('#err').textContent=e.message}};
$('#logout').onclick=async()=>{await api('/api/owner/logout',{method:'POST'});location.reload()};check();
</script></body></html>
